<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shark Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #scoreBoard {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #fff;
      font-size: 20px;
      font-family: sans-serif;
      z-index: 10000;
    }
    #fpsMeter {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      font-size: 20px;
      font-family: sans-serif;
      z-index: 10000;
      display: none;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100000;
      color: white;
      font-family: sans-serif;
      font-size: 36px;
    }
    #startButton {
      padding: 10px 20px;
      font-size: 24px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <canvas id="webglCanvas"></canvas>
  <div id="scoreBoard">Your score: 0</div>
  <div id="fpsMeter"></div>
  <div id="overlay">
    <div id="overlayText">Kliknij START, aby rozpocząć grę</div>
    <button id="startButton">START</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
